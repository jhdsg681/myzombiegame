<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Arcade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
            margin: 0;
            position: relative;
            min-height: 90vh;
        }
        h1 {
            color: #00ff66;
            font-size: 3rem;
            margin-bottom: 30px;
        }
        .arcade-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            transition: 0.3s;
        }
        .game-card:hover {
            border-color: #00ff66;
            transform: scale(1.05);
        }
        .play-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #00ff66;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        .play-button:hover {
            background-color: #00cc52;
        }

        /* Visible Control Panel Button */
        .admin-corner-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a2a;
            border: 2px solid #444;
            color: #00ff66;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            z-index: 9999;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .admin-corner-btn:hover {
            border-color: #00ff66;
            background: #00ff66;
            color: #000;
            transform: scale(1.05);
        }

        /* Admin Area Panel */
        .admin-panel {
            display: none;
            background-color: #111;
            border: 2px dashed #00ff66;
            border-radius: 10px;
            max-width: 500px;
            margin: 40px auto 0 auto;
            padding: 20px;
            text-align: left;
        }
        .admin-panel h2 {
            color: #00ff66;
            margin-top: 0;
        }
        .admin-panel input, .admin-panel button {
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #444;
            box-sizing: border-box;
        }
        .admin-panel input[type="text"] {
            background: #222;
            color: #fff;
            width: 100%;
        }
        .admin-panel button {
            background: #00ff66;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Visible Control Panel Button in the top-right corner -->
    <button class="admin-corner-btn" onclick="checkAdminPassword()">🛠️ Control Panel</button>

    <h1>Welcome to My Arcade</h1>
    <p>Select a game to start playing instantly!</p>

    <!-- Game List Container -->
    <div class="arcade-container" id="gameContainer">
        <!-- Original Zombie Game -->
        <div class="game-card">
            <h2>🌍 Original Zombie</h2>
            <p>Your main built-in game file.</p>
            <a href="zombie.html" class="play-button">Play Game</a>
        </div>
    </div>

    <!-- Hidden Admin Dashboard Area -->
    <div class="admin-panel" id="adminPanel">
        <h2>🛠️ Admin Control Panel</h2>
        <p>Upload an HTML game file to instantly deploy it.</p>
        <hr style="border-color: #333;">
        
        <form id="uploadForm">
            <label>Game Display Name:</label>
            <input type="text" id="gameName" placeholder="e.g., Retro Snake" required>
            
            <label>Select Game HTML File:</label>
            <input type="file" id="gameFile" accept=".html" required>
            
            <button type="submit" id="uploadBtn">Upload & Publish Game</button>
        </form>
        
        <button style="background: #333; color: #fff; margin-top: 15px;" onclick="document.getElementById('adminPanel').style.display='none'">Close Admin Panel</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadUploadedGames);

        function checkAdminPassword() {
            var password = prompt("Enter Admin Password:");
            if (password === "5867") {
                alert("Access Granted!");
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
            } else if (password !== null) {
                alert("Incorrect password access denied.");
            }
        }

        // Handle Form Submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = "Uploading... Please wait...";
            uploadBtn.disabled = true;

            const fileInput = document.getElementById('gameFile');
            const nameInput = document.getElementById('gameName');

            const formData = new FormData();
            formData.append('gameFile', fileInput.files[0]);
            formData.append('gameName', nameInput.value);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Success! Game uploaded to Vercel.");
                    
                    const newGame = { name: nameInput.value, url: data.url };
                    let currentGames = JSON.parse(localStorage.getItem('arcadeGames')) || [];
                    currentGames.push(newGame);
                    localStorage.setItem('arcadeGames', JSON.stringify(currentGames));

                    addGameCard(newGame.name, newGame.url);
                    
                    document.getElementById('uploadForm').reset();
                    document.getElementById('adminPanel').style.display = 'none';
                } else {
                    alert("Upload failed: " + data.error);
                }
            } catch (err) {
                alert("Error connecting to upload server.");
            } finally {
                uploadBtn.innerText = "Upload & Publish Game";
                uploadBtn.disabled = false;
            }
        });

        function addGameCard(name, url) {
            const container = document.getElementById('gameContainer');
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <h2>🎮 ${name}</h2>
                <p>Custom user uploaded arcade game.</p>
                <a href="${url}" class="play-button" target="_blank">Play Game</a>
            `;
            container.appendChild(card);
        }

        function loadUploadedGames() {
            let currentGames = JSON.parse(localStorage.getItem('arcadeGames')) || [];
            currentGames.forEach(game => {
                addGameCard(game.name, game.url);
            });
        }
    </script>

</body>
</html>
