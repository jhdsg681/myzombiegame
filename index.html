<!DOCTYPE html>
<html>
<head>
    <title>Arcade Hub</title>
    <style>
        body { font-family: sans-serif; display: flex; background: #121212; color: #fff; margin: 0; height: 100vh; }
        .sidebar { width: 200px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar button { background: #2d2d2d; color: #fff; border: none; padding: 10px; cursor: pointer; text-align: left; }
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        .panel { display: none; flex: 1; }
        .active { display: block; }
        .active-flex { display: flex; gap: 20px; flex: 1; }
        textarea { width: 100%; height: 150px; background: #181818; color: #fff; border: 1px solid #333; padding: 10px; }
        iframe { flex: 1; background: #fff; border: none; height: 300px; }
        .banner { background: #222831; padding: 10px; margin-bottom: 20px; border-left: 4px solid #00adb5; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>PLATFORM</h3>
        <button onclick="tab('editor')">💻 Editor</button>
        <button onclick="tab('games')">🕹️ Games</button>
        <button onclick="tab('admin')">🔒 Admin</button>
    </div>

    <div class="main">
        <div id="banner" class="banner" style="display:none"></div>

        <!-- EDITOR -->
        <div id="p-editor" class="panel active">
            <h2>HTML Workspace</h2>
            <div class="active-flex">
                <textarea id="tx" oninput="run()"></textarea>
                <iframe id="pv"></iframe>
            </div>
        </div>

        <!-- GAMES -->
        <div id="p-games" class="panel">
            <h2>Hosted Games</h2>
            <div id="g-list"></div>
            <div id="g-play" style="display:none; flex-direction:column; height:100%;">
                <button onclick="closeGame()" style="background:#ff2e63; color:#fff; width:100px; padding:5px; margin-bottom:10px;">Exit</button>
                <iframe id="g-frame"></iframe>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="p-admin" class="panel">
            <h2>Admin Panel</h2>
            <div id="auth">
                <input type="password" id="pass" placeholder="Password">
                <button onclick="login()">Unlock</button>
            </div>
            <div id="dash" style="display:none">
                <h3>Post Announcement</h3>
                <input type="text" id="ann-in" placeholder="Announcement text">
                <button onclick="addAnn()">Broadcast</button>
                <div id="a-manage" style="margin: 15px 0;"></div>

                <h3>Publish HTML Game</h3>
                <input type="text" id="g-title" placeholder="Game Title"><br><br>
                <textarea id="g-code" placeholder="HTML Code"></textarea><br><br>
                <button onclick="addGame()">Deploy Game</button>
                <div id="g-manage" style="margin: 15px 0;"></div>
            </div>
        </div>
    </div>

    <script>
        let anns = [], games = [], authed = false;
        const tx = document.getElementById('tx'), pv = document.getElementById('pv');
        
        tx.value = `<h1>Playground</h1>`; pv.srcdoc = tx.value;
        function run() { pv.srcdoc = tx.value; }

        async function load() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                anns = data.announcements; games = data.customGames;
                render();
            } catch (e) { console.log("Offline"); }
        }

        function tab(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`p-${name}`).classList.add('active');
            if(name === 'games') closeGame();
        }

        function login() {
            if(document.getElementById('pass').value === "5867") {
                authed = true; document.getElementById('auth').style.display = 'none';
                document.getElementById('dash').style.display = 'block'; render();
            } else { alert("Denied"); }
        }

        function render() {
            const b = document.getElementById('banner');
            b.style.display = anns.length ? 'block' : 'none';
            b.innerHTML = anns.map(a => `<div>📢 ${a.text}</div>`).join('');
            
            document.getElementById('g-list').innerHTML = games.map(g => `<div><h3>${g.title}</h3><button onclick="play(${g.id})">Play</button></div>`).join('');
            
            if(!authed) return;
            document.getElementById('a-manage').innerHTML = anns.map(a => `<div>${a.text} <button onclick="delAnn(${a.id})">X</button></div>`).join('');
            document.getElementById('g-manage').innerHTML = games.map(g => `<div>🎮 ${g.title} <button onclick="delGame(${g.id})">X</button></div>`).join('');
        }

        async function addAnn() {
            const i = document.getElementById('ann-in'); if(!i.value.trim()) return;
            await fetch('/api/announcements', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: i.value }) });
            i.value = ''; load();
        }
        async function delAnn(id) { await fetch(`/api/announcements/${id}`, { method: 'DELETE' }); load(); }

        async function addGame() {
            const t = document.getElementById('g-title'), c = document.getElementById('g-code');
            if(!t.value.trim() || !c.value.trim()) return;
            await fetch('/api/games', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: t.value, code: c.value }) });
            t.value = ''; c.value = ''; load(); alert("Published!");
        }
        async function delGame(id) { await fetch(`/api/games/${id}`, { method: 'DELETE' }); load(); }

        function play(id) {
            const g = games.find(x => x.id === id); if(!g) return;
            document.getElementById('g-list').style.display = 'none';
            const p = document.getElementById('g-play'); p.style.display = 'flex';
            document.getElementById('g-frame').srcdoc = g.code;
        }
        function closeGame() {
            document.getElementById('g-play').style.display = 'none';
            document.getElementById('g-list').style.display = 'block';
            document.getElementById('g-frame').srcdoc = '';
        }
        load();
    </script>
</body>
</html>
