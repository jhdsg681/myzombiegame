<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub & Arcade Terminal</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #ff3e3e;
            --input-bg: #222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.5s ease, background-image 0.5s ease;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .layout {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            height: fit-content;
        }

        h2 { margin-top: 0; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; }

        /* --- Community Post Wall --- */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, textarea, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: var(--input-bg);
            color: #fff;
            font-family: inherit;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        .posts-container {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .post {
            background-color: #222;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
        .post-meta { font-size: 0.8rem; color: #aaa; margin-top: 5px; }

        /* --- Arcade Layout Elements --- */
        .arcade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .arcade-controls-row { display: flex; align-items: center; gap: 10px; }
        
        .game-viewport {
            background-color: #000;
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Fullscreen API styling overrides */
        .game-viewport:fullscreen { width: 100vw; height: 100vh; border-radius: 0; }
        .game-viewport:-webkit-full-screen { width: 100vw; height: 100vh; border-radius: 0; }
        
        canvas { display: block; background: #111; max-width: 100%; max-height: 100%; }
        
        .game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .game-ui {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 1.1rem;
            text-shadow: 2px 2px 2px #000;
            z-index: 5;
        }

        /* --- Admin Portal Section --- */
        .admin-box { margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .hidden { display: none !important; }
        .bg-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="layout">
        <!-- LEFT COLUMN: POST FEED & SYSTEM ADMIN -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h2>💬 Community Wall</h2>
                <div class="input-group">
                    <input type="text" id="authorInput" placeholder="Your Name" maxlength="20">
                    <textarea id="messageInput" placeholder="Write a public post..." rows="3" maxlength="250"></textarea>
                    <button onclick="submitPost()">Publish Post</button>
                </div>
                <div class="posts-container" id="postsContainer"></div>
            </div>

            <!-- Secured Operations Unit -->
            <div class="card admin-box">
                <h2>🛠️ Admin Panel</h2>
                <div id="adminAuth">
                    <input type="password" id="adminPin" placeholder="Enter Admin PIN" style="width: calc(100% - 22px); margin-bottom: 10px;">
                    <button onclick="verifyAdmin()" style="width: 100%;">Unlock Controls</button>
                    <p id="authError" style="color: #ff5555; font-size: 0.9rem; margin: 5px 0 0 0; display: none;">Invalid PIN code.</p>
                </div>

                <div id="adminControls" class="hidden">
                    <p style="color: #4caf50; font-weight: bold; margin: 0 0 10px 0;">✨ Admin Mode Active</p>
                    <label>Choose Environment Theme:</label>
                    <div class="bg-options">
                        <button onclick="setTheme('dark')">Default Dark</button>
                        <button onclick="setTheme('cyber')">Matrix Digital</button>
                        <button onclick="setTheme('space')">Deep Space</button>
                        <button onclick="setTheme('sunset')">Sunset Gradient</button>
                    </div>
                    <button style="background-color: #d32f2f; margin-top: 15px; width: 100%;" onclick="clearAllPosts()">Wipe All Posts</button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: CHOSEN GAMES CORE -->
        <div class="card">
            <div class="arcade-header">
                <h2 style="border: none; margin: 0;">🎮 Arcade Engine</h2>
                <div class="arcade-controls-row">
                    <div>
                        <label for="gameSelector" style="font-size: 0.9rem; margin-right: 8px;">Switch Game:</label>
                        <select id="gameSelector" onchange="switchGameModule()">
                            <option value="pearl">Omega Pearl Fight: FINALE</option>
                            <option value="zombie">Zombie Outbreak</option>
                        </select>
                    </div>
                    <button onclick="toggleFullscreen()" style="background-color: #555; padding: 8px 12px; font-size: 0.9rem;">🖥️ Fullscreen</button>
                </div>
            </div>

            <div class="game-viewport" id="viewport">
                <!-- Live Game Heads-Up-Display -->
                <div class="game-ui" id="gameUI"></div>
                
                <!-- Main Canvas Engine Rendering Object -->
                <canvas id="gameCanvas" width="800" height="500"></canvas>

                <!-- Initial Setup State Screen Interface Overlays -->
                <div class="game-overlay" id="gameOverlay">
                    <h1 id="overlayTitle">Omega Pearl Fight</h1>
                    <p id="overlayDesc">Protect the core from incoming hostile entities!</p>
                    
                    <!-- Password Field for Omega Pearl -->
                    <div id="pearlPasscodeArea" style="margin-bottom: 15px;">
                        <input type="password" id="gamePasswordInput" placeholder="Enter Game Password" style="width: 200px; text-align: center; font-size: 1rem;">
                    </div>

                    <button onclick="bootSelectedGame()" style="font-size: 1.2rem; padding: 12px 30px;">Start Game</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // --- State Registries & Local Settings Sync ---
        let posts = JSON.parse(localStorage.getItem('saved_posts_v3')) || [];
        let currentTheme = localStorage.getItem('site_theme_v3') || 'dark';
        let activeModule = 'pearl'; 
        let gameInterval = null;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        window.onload = function() {
            renderPosts();
            applyTheme(currentTheme);
            switchGameModule(); 
        };

        // --- Fullscreen Feature Core ---
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (viewport.requestFullscreen) { viewport.requestFullscreen(); }
                else if (viewport.webkitRequestFullscreen) { viewport.webkitRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        // --- Community Post Wall Actions ---
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            if(posts.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; margin: 20px 0;">No updates posted yet.</p>';
                return;
            }
            [...posts].reverse().forEach(post => {
                const element = document.createElement('div');
                element.className = 'post';
                element.innerHTML = `
                    <strong>${escapeHTML(post.author)}</strong>
                    <p style="margin: 5px 0 0 0; word-break: break-word;">${escapeHTML(post.message)}</p>
                    <div class="post-meta">${post.timestamp}</div>
                `;
                container.appendChild(element);
            });
        }

        function submitPost() {
            const author = document.getElementById('authorInput').value.trim() || 'Anonymous';
            const message = document.getElementById('messageInput').value.trim();
            if (!message) return alert('Please enter a message to post!');

            posts.push({ author, message, timestamp: new Date().toLocaleString() });
            localStorage.setItem('saved_posts_v3', JSON.stringify(posts));
            document.getElementById('messageInput').value = '';
            renderPosts();
        }

        // --- Control Deck Authentication Engine ---
        function verifyAdmin() {
            if (document.getElementById('adminPin').value === "5867") {
                document.getElementById('adminAuth').classList.add('hidden');
                document.getElementById('adminControls').classList.remove('hidden');
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        function clearAllPosts() {
            if(confirm('Are you sure you want to permanently delete all messages?')) {
                posts = []; localStorage.removeItem('saved_posts_v3'); renderPosts();
            }
        }

        // --- Theme Application Engine ---
        function setTheme(theme) {
            currentTheme = theme; localStorage.setItem('site_theme_v3', theme); applyTheme(theme);
        }

        function applyTheme(theme) {
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = '';
            if(theme === 'cyber') {
                document.body.style.backgroundColor = '#031204';
                document.body.style.backgroundImage = "radial-gradient(rgba(0, 30, 0, 0.75), black), url('https://transparenttextures.com')";
            } else if(theme === 'space') {
                document.body.style.backgroundImage = "url('https://unsplash.com')";
            } else if(theme === 'sunset') {
                document.body.style.backgroundImage = "linear-gradient(135deg, #f5576c 0%, #f093fb 100%)";
            } else {
                document.body.style.backgroundColor = '#1a1a1a';
            }
        }

        // --- Game Terminal Hub Controller Routing ---
        function switchGameModule() {
            stopGameLoop();
            activeModule = document.getElementById('gameSelector').value;
            const title = document.getElementById('overlayTitle');
            const desc = document.getElementById('overlayDesc');
            const passArea = document.getElementById('pearlPasscodeArea');
            
            document.getElementById('gameUI').innerHTML = '';
            document.getElementById('gameOverlay').classList.remove('hidden');
            document.getElementById('gamePasswordInput').value = ''; 

            if(activeModule === 'pearl') {
                title.innerText = "Omega Pearl Fight: FINALE";
                desc.innerText = "Move your mouse to rotate your shield guard. Protect the center glowing pearl from incoming dark particles.";
                passArea.style.display = 'block'; 
            } else {
                title.innerText = "Zombie Outbreak";
                desc.innerText = "Eliminate incoming waves. Controls: [WASD / Arrows] to Move, [Mouse] to Target / Shoot, [R] to Reload.";
                passArea.style.display = 'none'; 
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function stopGameLoop() {
            if(gameInterval) { clearInterval(gameInterval); gameInterval = null; }
            window.removeEventListener('keydown', handleKeyDown);
            window.removeEventListener('keyup', handleKeyUp);
            canvas.removeEventListener('mousemove', handleMouseMove);
            canvas.removeEventListener('mousedown', handleMouseDown);
        }

        function bootSelectedGame() {
            if (activeModule === 'pearl') {
                const enteredPass = document.getElementById('gamePasswordInput').value;
                if (enteredPass !== "676767") {
                    alert("Access Denied! Incorrect game security password.");
                    return;
                }
            }

            document.getElementById('gameOverlay').classList.add('hidden');
            stopGameLoop();
            if(activeModule === 'pearl') initPearlGame(); else initZombieGame();
        }

        // --- Shared Operational Peripheral Hook Listeners ---
        let keys = {}, mouse = {x: 400, y: 250, clicked: false};
        function handleKeyDown(e) { keys[e.key.toLowerCase()] = true; if(e.key === 'r' || e.key === 'R') triggerManualReload(); }
        function handleKeyUp(e) { keys[e.key.toLowerCase()] = false; }
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        }
        function handleMouseDown() { mouse.clicked = true; }

        // --- ENGINE 1: OMEGA PEARL FIGHT ---
        let pearlState;
        function initPearlGame() {
            pearlState = {
                coreX: 400, coreY: 250, radius: 22, shieldAngle: 0, shieldWidth: 1.2, shieldDist: 45,
                projectiles: [], particleTimer: 0, score: 0, health: 100, difficulty: 1
            };
            canvas.addEventListener('mousemove', handleMouseMove);
            gameInterval = setInterval(updatePearlGame, 1000/60);
        }

        function updatePearlGame() {
            ctx.fillStyle = '#0f111a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            let dx = mouse.x - pearlState.coreX;
            let dy = mouse.y - pearlState.coreY;
            pearlState.shieldAngle = Math.atan2(dy, dx);

            pearlState.particleTimer++;
            if(pearlState.particleTimer > Math.max(12, 45 - pearlState.difficulty * 2)) {
                pearlState.particleTimer = 0;
                let angle = Math.random() * Math.PI * 2;
                pearlState.projectiles.push({
                    x: pearlState.coreX + Math.cos(angle) * 550,
                    y: pearlState.coreY + Math.sin(angle) * 550,
                    speed: 2 + Math.random() * 2 + (pearlState.difficulty * 0.15),
                    size: 5 + Math.random() * 5
                });
                pearlState.difficulty += 0.04;
            }

            ctx.beginPath(); ctx.arc(pearlState.coreX, pearlState.coreY, pearlState.radius, 0, Math.PI*2);
            ctx.fillStyle = '#00ffff'; ctx.fill();

            ctx.beginPath();
            ctx.arc(pearlState.coreX, pearlState.coreY, pearlState.shieldDist, pearlState.shieldAngle - pearlState.shieldWidth/2, pearlState.shieldAngle + pearlState.shieldWidth/2);
            ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 6; ctx.stroke();

            for(let i = pearlState.projectiles.length - 1; i >= 0; i--) {
                let p = pearlState.projectiles[i];
                let pAngle = Math.atan2(p.y - pearlState.coreY, p.x - pearlState.coreX);
                p.x -= Math.cos(pAngle) * p.speed;
                p.y -= Math.sin(pAngle) * p.speed;

                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = '#ff1744'; ctx.fill();

                let distance = Math.hypot(p.x - pearlState.coreX, p.y - pearlState.coreY);

                if(distance <= pearlState.shieldDist + 5 && distance >= pearlState.shieldDist - 8) {
                    let targetAngle = Math.atan2(p.y - pearlState.coreY, p.x - pearlState.coreX);
                    let diff = Math.abs(targetAngle - pearlState.shieldAngle);
                    if(diff > Math.PI) diff = Math.PI*2 - diff;

if(diff <= pearlState.shieldWidth / 2) {
pearlState.projectiles.splice(i, 1);
pearlState.score += 10;
continue;
}
}
if(distance <= pearlState.radius + 4) {
pearlState.health -= 10;
pearlState.projectiles.splice(i, 1);
if(pearlState.health <= 0) endGameSession("Pearl Core Shattered! Score: " + pearlState.score);
}
}
document.getElementById('gameUI').innerHTML = <span style="color:#00ffff">Health: ${pearlState.health}%</span><span style="color:#ffeb3b">Score: ${pearlState.score}</span>;
}
// --- ENGINE 2: ZOMBIE OUTBREAK ---
let zState;
function initZombieGame() {
zState = {
px: 400, py: 250, pSpeed: 2.8, pSize: 12,
zombies: [], bullets: [],
score: 0, health: 100, wave: 1, ammo: 12, maxAmmo: 12, reloading: false, reloadTimer: 0, spawnTimer: 0
};
window.addEventListener('keydown', handleKeyDown); window.addEventListener('keyup', handleKeyUp);
canvas.addEventListener('mousemove', handleMouseMove); canvas.addEventListener('mousedown', handleMouseDown);
gameInterval = setInterval(updateZombieGame, 1000/60);
}
function triggerManualReload() {
if(!zState.reloading && zState.ammo < zState.maxAmmo) { zState.reloading = true; zState.reloadTimer = 0; }
}
function updateZombieGame() {
ctx.fillStyle = '#2e3d26'; ctx.fillRect(0, 0, canvas.width, canvas.height);
if (keys['w'] || keys['arrowup']) zState.py = Math.max(zState.pSize, zState.py - zState.pSpeed);
if (keys['s'] || keys['arrowdown']) zState.py = Math.min(canvas.height - zState.pSize, zState.py + zState.pSpeed);
if (keys['a'] || keys['arrowleft']) zState.px = Math.max(zState.pSize, zState.px - zState.pSpeed);
if (keys['d'] || keys['arrowright']) zState.px = Math.min(canvas.width - zState.pSize, zState.px + zState.pSpeed);
if(zState.reloading) {
zState.reloadTimer++;
if(zState.reloadTimer >= 55) { zState.ammo = zState.maxAmmo; zState.reloading = false; }
}
if(mouse.clicked) {
mouse.clicked = false;
if(!zState.reloading) {
if(zState.ammo > 0) {
zState.ammo--;
let angle = Math.atan2(mouse.y - zState.py, mouse.x - zState.px);
zState.bullets.push({ x: zState.px, y: zState.py, dx: Math.cos(angle)*7.5, dy: Math.sin(angle)*7.5 });
} else { zState.reloading = true; zState.reloadTimer = 0; }
}
}
zState.spawnTimer++;
let spawnInterval = Math.max(18, 75 - zState.wave * 4);
if(zState.spawnTimer > spawnInterval) {
zState.spawnTimer = 0;
let border = Math.floor(Math.random() * 4);
let zx, zy;
if(border === 0) { zx = Math.random()*canvas.width; zy = -15; }
else if(border === 1) { zx = canvas.width+15; zy = Math.random()*canvas.height; }
else if(border === 2) { zx = Math.random()*canvas.width; zy = canvas.height+15; }
else { zx = -15; zy = Math.random()*canvas.height; }
zState.zombies.push({ x: zx, y: zy, hp: 1 + Math.floor(zState.wave/3), speed: 1.1 + Math.random()*1.1 });
}
ctx.fillStyle = '#ffeb3b';
for(let bIdx = zState.bullets.length-1; bIdx >=0; bIdx--) {
let b = zState.bullets[bIdx]; b.x += b.dx; b.y += b.dy;
ctx.fillRect(b.x-2, b.y-2, 4, 4);
if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) zState.bullets.splice(bIdx, 1);
}
for(let zIdx = zState.zombies.length-1; zIdx >= 0; zIdx--) {
let z = zState.zombies[zIdx];
let zAngle = Math.atan2(zState.py - z.y, zState.px - z.x);
z.x += Math.cos(zAngle) * z.speed; z.y += Math.sin(zAngle) * z.speed;
ctx.beginPath(); ctx.arc(z.x, z.y, 11, 0, Math.PI*2);
ctx.fillStyle = '#4caf50'; ctx.fill();
for(let bIdx = zState.bullets.length-1; bIdx >= 0; bIdx--) {
let b = zState.bullets[bIdx];
if(Math.hypot(b.x - z.x, b.y - z.y) < 13) {
z.hp--; zState.bullets.splice(bIdx, 1);
if(z.hp <= 0) {
zState.zombies.splice(zIdx, 1); zState.score += 20;
if(zState.score % 160 === 0) zState.wave++;
break;
}
}
}
if(zState.zombies[zIdx] && Math.hypot(z.x - zState.px, z.y - zState.py) < 22) {
zState.health -= 0.35;
if(zState.health <= 0) endGameSession("Overrun by Zombies! Reached Wave: " + zState.wave);
}
}
ctx.beginPath(); ctx.arc(zState.px, zState.py, zState.pSize, 0, Math.PI*2);
ctx.fillStyle = '#00b0ff'; ctx.fill();
let lookAngle = Math.atan2(mouse.y - zState.py, mouse.x - zState.px);
ctx.beginPath(); ctx.moveTo(zState.px, zState.py);
ctx.lineTo(zState.px + Math.cos(lookAngle)*16, zState.py + Math.sin(lookAngle)*16);
ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
let magText = zState.reloading ? "RELOADING..." : ${zState.ammo} / ${zState.maxAmmo};
document.getElementById('gameUI').innerHTML = <span style="color:#ff3333">Health: ${Math.max(0, Math.floor(zState.health))}%</span> <span style="color:#4caf50">Wave: ${zState.wave}</span> <span style="color:#ffffff">Ammo: ${magText}</span>;
}
function endGameSession(summary) {
stopGameLoop();
document.getElementById('overlayTitle').innerText = "GAME OVER";
document.getElementById('overlayDesc').innerText = summary;
document.getElementById('gameOverlay').classList.remove('hidden');
}
function escapeHTML(str) {
return str.replace(/[&<>'"]/g, t => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[t] || t));
}
