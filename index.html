<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub & Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; background-color: #121212; color: #e0e0e0; overflow: hidden; }
        .sidebar { width: 260px; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #2d2d2d; padding: 20px 10px; }
        .sidebar-brand { font-size: 20px; font-weight: bold; color: #00adb5; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
        .nav-btn { background: none; border: none; color: #aaaaaa; padding: 12px 15px; text-align: left; font-size: 15px; cursor: pointer; border-radius: 6px; margin-bottom: 8px; width: 100%; }
        .nav-btn:hover, .nav-btn.active { background-color: #2d2d2d; color: #ffffff; }
        .nav-btn.active { border-left: 4px solid #00adb5; background-color: #252525; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: #121212; }
        .announcement-banner { background-color: #222831; border-bottom: 1px solid #2d2d2d; padding: 10px 20px; display: none; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
        .announcement-item { background-color: #393e46; padding: 8px 12px; border-radius: 4px; border-left: 4px solid #00adb5; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .tab-panel { display: none; flex: 1; height: 100%; overflow-y: auto; padding: 25px; }
        .tab-panel.active-panel { display: flex; flex-direction: column; }
        h2 { margin-bottom: 20px; color: #ffffff; font-size: 24px; }
        .editor-container { display: flex; flex: 1; gap: 20px; height: 100%; min-height: 0; }
        .editor-box, .preview-box { flex: 1; display: flex; flex-direction: column; background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; overflow: hidden; }
        .box-header { background-color: #252525; padding: 10px 15px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #2d2d2d; color: #aaaaaa; }
        textarea { flex: 1; background-color: #181818; color: #d4d4d4; border: none; padding: 15px; font-family: monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
        iframe { flex: 1; border: none; background-color: #ffffff; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 25px; max-width: 600px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaaaaa; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; background-color: #181818; border: 1px solid #3a3a3a; border-radius: 4px; color: #ffffff; font-size: 14px; }
        .btn { background-color: #00adb5; color: #ffffff; border: none; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #008c9e; }
        .btn-danger { background-color: #ff2e63; }
        .btn-small { padding: 4px 8px; font-size: 12px; }
        .admin-list-item { display: flex; justify-content: space-between; align-items: center; background-color: #181818; padding: 12px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #2d2d2d; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .game-card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .game-title { font-size: 18px; font-weight: bold; color: #ffffff; }
        .game-player-view { display: none; flex-direction: column; flex: 1; height: 100%; }
        .game-player-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 1px solid #2d2d2d; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">ARCADE PLATFORM</div>
        <button class="nav-btn active" onclick="switchTab('editor')">💻 HTML Editor</button>
        <button class="nav-btn" onclick="switchTab('games')">🕹️ Hosted Games</button>
        <button class="nav-btn" onclick="switchTab('admin')">🔒 Admin Panel</button>
    </div>
    <div class="main-content">
        <div class="announcement-banner" id="announcement-banner"></div>
        <!-- HTML EDITOR PANEL -->
        <div id="panel-editor" class="tab-panel active-panel">
            <h2>Live HTML Workspace</h2>
            <div class="editor-container">
                <div class="editor-box">
                    <div class="box-header">Source Code (HTML/CSS/JS)</div>
                    <textarea id="editor-textarea"></textarea>
                </div>
                <div class="preview-box">
                    <div class="box-header">Live Output View</div>
                    <iframe id="editor-preview"></iframe>
                </div>
            </div>
        </div>

        <!-- HOSTED GAMES PANEL -->
        <div id="panel-games" class="tab-panel">
            <div id="game-auth" class="card">
                <h2>🔒 Premium Arcade Locked</h2>
                <div class="form-group" style="margin-top:15px;">
                    <label>Enter Game Verification Password:</label>
                    <input type="password" id="game-pass" placeholder="••••">
                </div>
                <button class="btn" onclick="checkGameAuth()">Unlock Games Menu</button>
            </div>
            <div id="game-library-view" style="display: none; width: 100%;">
                <h2>Community Hosted Games</h2>
                <div class="games-grid">
                    <div class="game-card">
                        <div class="game-title">Omega Pearl Fight: FINALE</div>
                        <button class="btn" onclick="launchBuiltInGame('omega')">Play Game</button>
                    </div>
                    <div class="game-card">
                        <div class="game-title">Zombie Outbreak Survival</div>
                        <button class="btn" onclick="launchBuiltInGame('zombie')">Play Game</button>
                    </div>
                </div>
            </div>
            <div id="game-player-view" class="game-player-view">
                <div class="game-player-header">
                    <span id="playing-game-title" style="font-weight: bold;">Running Game</span>
                    <button class="btn btn-small btn-danger" onclick="closeGame()">Exit Game</button>
                </div>
                <iframe id="game-frame" style="flex: 1; background: #fff;"></iframe>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="panel-admin" class="tab-panel">
            <h2>Administrator Controls</h2>
            <div id="admin-auth" class="card">
                <div class="form-group"><label>Enter Admin Password:</label><input type="password" id="admin-pass" placeholder="••••"></div>
                <button class="btn" onclick="checkAdminAuth()">Unlock Panel</button>
            </div>
            <div id="admin-dashboard" style="display: none; width: 100%;">
                <div class="card">
                    <h3>Post Announcement</h3>
                    <div class="form-group" style="margin-top: 15px;"><input type="text" id="new-announcement" placeholder="Type notice..."></div>
                    <button class="btn" onclick="postAnnouncement()">Broadcast Notice</button>
                </div>
                <div class="card" style="max-width: 400px;">
                    <h3>Active Announcements</h3>
                    <div id="admin-announcements-list" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let announcements = JSON.parse(localStorage.getItem('v_announcements')) || [];
        let isAdminAuthenticated = false;

        const tx = document.getElementById('editor-textarea');
        const pv = document.getElementById('editor-preview');

        tx.value = `<!DOCTYPE html>\n<html>\n<body style="background:#222;color:#fff;font-family:sans-serif;text-align:center;padding-top:50px;">\n  <h1 style="color:#00adb5;">Live Code Playground</h1>\n</body>\n</html>`;
        pv.srcdoc = tx.value;
        tx.addEventListener('input', () => { pv.srcdoc = tx.value; });

        function saveState() { localStorage.setItem('v_announcements', JSON.stringify(announcements)); }

        function switchTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active-panel'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`panel-${name}`).classList.add('active-panel');
            if (window.event) window.event.currentTarget.classList.add('active');
            if(name === 'games') closeGame();
        }

        function checkGameAuth() {
            if(document.getElementById('game-pass').value === "6767") {
                document.getElementById('game-auth').style.display = 'none';
                document.getElementById('game-library-view').style.display = 'block';
                renderGlobalViews();
            } else { alert("Incorrect Password"); }
        }

        function checkAdminAuth() {
            if(document.getElementById('admin-pass').value === "5867") {
                isAdminAuthenticated = true;
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminControls();
            } else { alert("Access Denied"); }
        }

        function renderGlobalViews() {
            const banner = document.getElementById('announcement-banner');
            banner.style.display = announcements.length === 0 ? 'none' : 'flex';
            banner.innerHTML = announcements.map(a => `<div class="announcement-item"><span>📢 ${a.text}</span></div>`).join('');
        }

        function renderAdminControls() {
            if(!isAdminAuthenticated) return;
            document.getElementById('admin-announcements-list').innerHTML = announcements.map(a => `<div class="admin-list-item"><span>${a.text}</span><button class="btn btn-small btn-danger" onclick="deleteAnnouncement(${a.id})">Delete</button></div>`).join('');
        }

        function postAnnouncement() {
            const input = document.getElementById('new-announcement'); if(!input.value.trim()) return;
            announcements.push({ id: Date.now(), text: input.value });
            input.value = ''; saveState(); renderGlobalViews(); renderAdminControls();
        }

        function deleteAnnouncement(id) {
            announcements = announcements.filter(a => a.id !== id);
            saveState(); renderGlobalViews(); renderAdminControls();
        }

        const builtInGames = {
            omega: `<!DOCTYPE html><html><body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;padding-top:100px;"><h1>Omega Pearl Fight: FINALE</h1><button style="background:#ff2e63;color:white;border:none;padding:10px 20px;cursor:pointer;font-weight:bold;" onclick="alert('Battle Started!')">Engage Boss</button></body></html>`,
            zombie: `<!DOCTYPE html><html><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;"><h2>Zombie Outbreak Survival</h2><p id="u">HP: 100 | Score: 0</p><canvas id="c" width="500" height="250" style="background:#000;border:2px solid #ff2e63;display:block;margin:0 auto;"></canvas><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let hp=100,score=0,px=250,py=125,keys={},z=Math.random;window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let zm=[];function tick(){ctx.clearRect(0,0,500,250);if(hp<=0){ctx.fillStyle='red';ctx.font='20px sans-serif';ctx.fillText('GAME OVER',200,125);return;}let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy-=3;if(keys['s']||keys['arrowdown'])dy+=3;if(keys['a']||keys['arrowleft'])dx-=3;if(keys['d']||keys['arrowright'])dx+=3;px=Math.max(10,Math.min(490,px+dx));py=Math.max(10,Math.min(240,py+dy));ctx.fillStyle='#00adb5';ctx.beginPath();ctx.arc(px,py,12,0,6.28);ctx.fill();if(zm.length<5&&z()<0.03)zm.push({x:z()*500,y:-10});for(let i=zm.length-1;i>=0;i--){zm[i].y+=1.5;ctx.fillStyle='#4e9f3d';ctx.beginPath();ctx.arc(zm[i].x,zm[i].y,10,0,6.28);ctx.fill();if(zm[i].y>260)zm.splice(i,1);else if(Math.hypot(px-zm[i].x,py-zm[i].y)<22){hp--;score+=5;}}document.getElementById('u').innerText='HP: '+hp+' | Score: '+score;requestAnimationFrame(tick);}tick();<\/script></body></html>`
        };

        function launchBuiltInGame(type) {
            document.getElementById('game-library-view').style.display = 'none';
            document.getElementById('game-player-view').style.display = 'flex';
            document.getElementById('playing-game-title').innerText = type === 'omega' ? 'Running: Omega Pearl Fight' : 'Running: Zombie Outbreak';
            document.getElementById('game-frame').srcdoc = builtInGames[type];
        }

        function closeGame() {
            document.getElementById('game-player-view').style.display = 'none';
            document.getElementById('game-library-view').style.display = 'block';
            document.getElementById('game-frame').srcdoc = "";
        }
        renderGlobalViews();
    </script>
</body>
</html>
