<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub & Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; background-color: #121212; color: #e0e0e0; overflow: hidden; }
        .sidebar { width: 260px; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #2d2d2d; padding: 20px 10px; }
        .sidebar-brand { font-size: 20px; font-weight: bold; color: #00adb5; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
        .nav-btn { background: none; border: none; color: #aaaaaa; padding: 12px 15px; text-align: left; font-size: 15px; cursor: pointer; border-radius: 6px; margin-bottom: 8px; transition: all 0.2s ease; }
        .nav-btn:hover, .nav-btn.active { background-color: #2d2d2d; color: #ffffff; }
        .nav-btn.active { border-left: 4px solid #00adb5; background-color: #252525; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: #121212; }
        .announcement-banner { background-color: #222831; border-bottom: 1px solid #2d2d2d; padding: 10px 20px; display: none; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
        .announcement-item { background-color: #393e46; padding: 8px 12px; border-radius: 4px; border-left: 4px solid #00adb5; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .tab-panel { display: none; flex: 1; height: 100%; overflow-y: auto; padding: 25px; }
        .tab-panel.active-panel { display: flex; flex-direction: column; }
        h2 { margin-bottom: 20px; color: #ffffff; font-size: 24px; }
        .editor-container { display: flex; flex: 1; gap: 20px; height: 100%; min-height: 0; }
        .editor-box, .preview-box { flex: 1; display: flex; flex-direction: column; background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; overflow: hidden; }
        .box-header { background-color: #252525; padding: 10px 15px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #2d2d2d; color: #aaaaaa; }
        textarea { flex: 1; background-color: #181818; color: #d4d4d4; border: none; padding: 15px; font-family: monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
        iframe { flex: 1; border: none; background-color: #ffffff; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 25px; max-width: 600px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaaaaa; }
        input[type="text"], input[type="password"], textarea.form-input { width: 100%; padding: 10px; background-color: #181818; border: 1px solid #3a3a3a; border-radius: 4px; color: #ffffff; font-size: 14px; }
        .btn { background-color: #00adb5; color: #ffffff; border: none; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #008c9e; }
        .btn-danger { background-color: #ff2e63; }
        .btn-small { padding: 4px 8px; font-size: 12px; }
        .admin-list-item { display: flex; justify-content: space-between; align-items: center; background-color: #181818; padding: 12px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #2d2d2d; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .game-card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .game-title { font-size: 18px; font-weight: bold; color: #ffffff; }
        .game-player-view { display: none; flex-direction: column; flex: 1; height: 100%; }
        .game-player-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 1px solid #2d2d2d; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">ARCADE PLATFORM</div>
        <button class="nav-btn active" onclick="switchTab('editor')">💻 HTML Editor</button>
        <button class="nav-btn" onclick="switchTab('games')">🕹️ Hosted Games</button>
        <button class="nav-btn" onclick="switchTab('admin')">🔒 Admin Panel</button>
    </div>
    <div class="main-content">
        <div class="announcement-banner" id="announcement-banner"></div>
        <!-- HTML EDITOR PANEL -->
        <div id="panel-editor" class="tab-panel active-panel">
            <h2>Live HTML Workspace</h2>
            <div class="editor-container">
                <div class="editor-box">
                    <div class="box-header">Source Code (HTML/CSS/JS)</div>
                    <textarea id="editor-textarea" placeholder="Write your code here..."></textarea>
                </div>
                <div class="preview-box">
                    <div class="box-header">Live Output View</div>
                    <iframe id="editor-preview"></iframe>
                </div>
            </div>
        </div>

        <!-- HOSTED GAMES PANEL -->
        <div id="panel-games" class="tab-panel">
            <div id="games-list-view" style="width: 100%;">
                <h2>Community Hosted Games</h2>
                <div class="games-grid" id="games-grid"></div>
            </div>
            <div id="game-player-view" class="game-player-view">
                <div class="game-player-header">
                    <span id="playing-game-title" style="font-weight: bold;">Game Setup</span>
                    <button class="btn btn-small btn-danger" onclick="closeGamePlayer()">Exit Game</button>
                </div>
                <iframe id="game-playback-frame" style="flex: 1; background: #fff;"> </iframe>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="panel-admin" class="tab-panel">
            <h2>Administrator Controls</h2>
            <div id="admin-auth" class="card">
                <div class="form-group">
                    <label for="admin-pass">Enter Security Password:</label>
                    <input type="password" id="admin-pass" placeholder="••••">
                </div>
                <button class="btn" onclick="checkAdminAuth()">Unlock Panel</button>
            </div>
            <div id="admin-dashboard" style="display: none; width: 100%;">
                <div class="card">
                    <h3>Post Global Announcement</h3>
                    <div class="form-group" style="margin-top: 15px;">
                        <input type="text" id="new-announcement" placeholder="Type notice here...">
                    </div>
                    <button class="btn" onclick="postAnnouncement()">Broadcast Notice</button>
                </div>
                <div class="card">
                    <h3>Publish Custom HTML Game</h3>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>Game Title</label>
                        <input type="text" id="game-name" placeholder="e.g., Retro Game">
                    </div>
                    <div class="form-group">
                        <label>Source Code</label>
                        <textarea id="game-code" class="form-input" style="height: 120px;" placeholder="<!DOCTYPE html>..."></textarea>
                    </div>
                    <button class="btn" onclick="publishGame()">Deploy Game</button>
                </div>
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div class="card" style="flex: 1; min-width: 250px;">
                        <h3>Announcements</h3>
                        <div id="admin-announcements-list" style="margin-top: 15px;"></div>
                    </div>
                    <div class="card" style="flex: 1; min-width: 250px;">
                        <h3>Uploaded Games</h3>
                        <div id="admin-games-list" style="margin-top: 15px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let announcements = [], customGames = [], isAdminAuthenticated = false;
        const editorTextarea = document.getElementById('editor-textarea');
        const editorPreview = document.getElementById('editor-preview');

        editorTextarea.value = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n  body { font-family: sans-serif; text-align: center; padding-top: 40px; background: #222; color: #fff; }\n  h1 { color: #00adb5; }\n</style>\n</head>\n<body>\n  <h1>Live Code Playground</h1>\n</body>\n</html>`;
        editorPreview.srcdoc = editorTextarea.value;
        editorTextarea.addEventListener('input', () => { editorPreview.srcdoc = editorTextarea.value; });

        async function loadServerData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                announcements = data.announcements; customGames = data.customGames;
                renderGlobalViews(); renderAdminControls();
            } catch (e) { console.error("Database offline", e); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active-panel'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`panel-${tabName}`).classList.add('active-panel');
            if (window.event) window.event.currentTarget.classList.add('active');
            if(tabName === 'games') closeGamePlayer();
        }

        function checkAdminAuth() {
            if(document.getElementById('admin-pass').value === "5867") {
                isAdminAuthenticated = true;
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminControls();
            } else { alert("Access Denied"); }
        }

        function renderGlobalViews() {
            const banner = document.getElementById('announcement-banner');
            banner.style.display = announcements.length === 0 ? 'none' : 'flex';
            banner.innerHTML = announcements.map(a => `<div class="announcement-item"><span>📢 ${a.text}</span></div>`).join('');
            
            const grid = document.getElementById('games-grid');
            if (grid) {
                grid.innerHTML = customGames.map(g => `<div class="game-card"><div class="game-title">${g.title}</div><button class="btn" onclick="launchGamePlayer(${g.id})">Launch Game</button></div>`).join('');
            }
        }

        function renderAdminControls() {
            if(!isAdminAuthenticated) return;
            document.getElementById('admin-announcements-list').innerHTML = announcements.map(a => `
                <div class="admin-list-item"><span>${a.text}</span><button class="btn btn-small btn-danger" onclick="deleteAnnouncement(${a.id})">Delete</button></div>`).join('');
            document.getElementById('admin-games-list').innerHTML = customGames.map(g => `
                <div class="admin-list-item"><span>🎮 ${g.title}</span><button class="btn btn-small btn-danger" onclick="deleteGame(${g.id})">Remove</button></div>`).join('');
        }

        async function postAnnouncement() {
            const input = document.getElementById('new-announcement'); if(!input.value.trim()) return;
            await fetch('/api/announcements', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: input.value }) });
            input.value = ''; loadServerData();
        }

        async function deleteAnnouncement(id) { await fetch(`/api/announcements/${id}`, { method: 'DELETE' }); loadServerData(); }

        async function publishGame() {
            const t = document.getElementById('game-name'), c = document.getElementById('game-code');
            if(!t.value.trim() || !c.value.trim()) return;
            await fetch('/api/games', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: t.value, code: c.value }) });
            t.value = ''; c.value = ''; loadServerData(); alert("Game Published!");
        }

        async function deleteGame(id) { await fetch(`/api/games/${id}`, { method: 'DELETE' }); loadServerData(); }

        function launchGamePlayer(id) {
            const g = customGames.find(x => x.id === id); if(!g) return;
            document.getElementById('games-list-view').style.display = 'none';
            document.getElementById('game-player-view').style.display = 'flex';
            document.getElementById('playing-game-title').innerText = `Running: ${g.title}`;
            document.getElementById('game-playback-frame').srcdoc = g.code;
        }

        function closeGamePlayer() {
            document.getElementById('game-player-view').style.display = 'none';
            document.getElementById('games-list-view').style.display = 'block';
            document.getElementById('game-playback-frame').srcdoc = "";
        }
        loadServerData();
    </script>
</body>
</html>
